version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: campaignops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campaignops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campaignops_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-campaignops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campaignops} -d ${POSTGRES_DB:-campaignops}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
